<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Wandering-Mind Wonderland</title>
<style>
  :root{
    --bg:#0e1a1e;
    --bg:oklch(0.13 0.02 210);
    --ink:#ece5d3;
    --ink:oklch(0.93 0.02 95);
    --teal:#3f8c8c;
    --teal:oklch(0.55 0.095 180);
    --gold:#d8b25f;
    --gold:oklch(0.80 0.12 85);
    --font:Georgia,"Iowan Old Style","Times New Roman",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  canvas#stage{
    position:fixed;inset:0;display:block;touch-action:none;
    opacity:0.68;filter:saturate(0.72) contrast(0.94) blur(3px);
    transition:opacity 1.45s ease-out,filter 1.45s ease-out;
  }
  body.dreaming canvas#stage{opacity:1;filter:none}

  
  #veil{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-start;
    background:oklch(0.09 0.02 220);overflow:hidden;isolation:isolate;
    color:var(--ink);font-family:var(--font);text-align:left;
    z-index:30;transition:opacity 1.45s ease-out,filter 1.45s ease-out,transform 1.45s ease-out;
    padding:clamp(2.2rem,6vh,4.5rem) clamp(1.6rem,6vw,6.5rem) clamp(1.2rem,3.5vh,2.6rem);
  }
  .veil-stack{                                                  /* 全部聚在左侧一列 */
    display:flex;flex-direction:column;
    width:min(100%,32rem);gap:1.6rem;
  }
  #veil::before{
    content:"";position:absolute;inset:-1%;z-index:-2;
    background-image:url('assets/wonderland-opening.webp?v=3');
    background-size:cover;background-position:center center;background-repeat:no-repeat;
    filter:saturate(0.88) contrast(1.03) brightness(1.02);
    transform:scale(1.008);animation:veilDrift 16s ease-in-out infinite alternate;
  }
  #veil::after{
    content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:
      linear-gradient(90deg,oklch(0.05 0.018 225 / 0.62) 0%,oklch(0.07 0.02 215 / 0.16) 48%,oklch(0.055 0.018 225 / 0.38) 100%),
      linear-gradient(180deg,oklch(0.055 0.018 225 / 0.18) 0%,transparent 40%,oklch(0.04 0.015 225 / 0.58) 100%);
  }
  #veil.gone{opacity:0;pointer-events:none;filter:saturate(0.62) contrast(1.08);transform:scale(1.008)}
  @keyframes veilDrift{
    from{transform:scale(1.008) translate3d(-0.18%,0,0)}
    to{transform:scale(1.018) translate3d(0.18%,-0.18%,0)}
  }
  @keyframes veilIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .veil-brand{animation:veilIn 0.9s 0.1s ease-out backwards}
  .veil-menu{animation:veilIn 0.9s 0.3s ease-out backwards}
  .veil-brand{max-width:100%}
  #veil h1{
    display:flex;flex-direction:column;align-items:flex-start;gap:0.52rem;
    font-weight:400;text-indent:0;text-wrap:balance;
    text-shadow:0 4px 30px oklch(0.04 0.015 220),0 1px 3px oklch(0.04 0.015 220);
  }
  #veil h1 .title-prelude{
    display:block;padding-left:0.18em;
    font-size:clamp(0.9rem,1.45vw,1.22rem);line-height:1.2;
    letter-spacing:0.46em;text-transform:uppercase;color:var(--gold);
  }
  #veil h1 .title-main{
    display:block;font-size:clamp(4.25rem,6.25vw,6.45rem);line-height:0.88;
    letter-spacing:-0.045em;color:oklch(0.95 0.025 95);
  }
  #veil .sub{
    font-size:clamp(0.93rem,1.35vw,1.06rem);line-height:1.65;margin-top:1.7rem;
    color:oklch(0.90 0.02 95 / 0.9);max-width:37ch;letter-spacing:0.035em;
    text-shadow:0 2px 18px oklch(0.04 0.015 220);
  }
  #veil .sub b{color:var(--gold);font-weight:400}
  #veil .premise{
    font-size:clamp(0.72rem,1.1vw,0.84rem);letter-spacing:0.12em;line-height:1.75;
    color:oklch(0.90 0.02 95 / 0.6);margin-top:1.1rem;padding-left:0.95rem;
    border-left:1px solid oklch(0.80 0.12 85 / 0.5);
    text-shadow:0 2px 15px oklch(0.04 0.015 220)
  }
  .veil-menu{
    width:100%;max-width:21rem;display:grid;gap:0.9rem;margin-top:1.1rem;justify-items:start;
  }
  /* 参考 ARCO / The Last Campfire:游戏菜单就是纯文字,没有盒子 */
  #enter{
    position:relative;width:max-content;padding:0.3rem 0 0.3rem 1.5rem;
    font-family:var(--font);text-align:left;color:oklch(0.95 0.02 95);
    font-size:clamp(1.2rem,1.8vw,1.5rem);letter-spacing:0.16em;line-height:1.2;
    background:transparent;border:0;border-radius:0;cursor:pointer;
    text-shadow:0 2px 14px oklch(0.04 0.015 220),0 1px 3px oklch(0.04 0.015 220);
    transition:color .3s ease,transform .28s ease,letter-spacing .3s ease;
  }
  #enter::before{
    content:"";position:absolute;left:0.1rem;top:50%;width:0.55rem;height:0.55rem;
    background:var(--gold);transform:translateY(-50%) rotate(45deg);
    box-shadow:0 0 12px oklch(0.80 0.12 85 / 0.7);
    animation:menuPulse 2.8s ease-in-out infinite;
  }
  @keyframes menuPulse{0%,100%{opacity:0.65}50%{opacity:1}}
  #enter:hover{color:var(--gold);transform:translateX(0.35rem)}
  #enter:active{transform:translateX(0.2rem) scale(0.99)}
  .aihook{
    position:relative;width:max-content;min-height:2.2rem;justify-self:start;
    display:flex;align-items:center;justify-content:flex-start;gap:0.55rem;
    font-family:var(--font);font-size:0.69rem;letter-spacing:0.13em;text-align:left;
    color:oklch(0.90 0.02 95 / 0.55);background:transparent;border:0;border-radius:0;cursor:pointer;
    padding:0.15rem 0 0.15rem 1.5rem;text-shadow:0 2px 10px oklch(0.04 0.015 220);
    transition:color .3s,background .3s;
  }
  .aihook::before{content:none}
  .aihook:hover{color:oklch(0.93 0.02 95)}
  .aihook .status{
    font-size:0.66rem;letter-spacing:0.18em;color:oklch(0.90 0.02 95 / 0.48);
    border:0;border-left:1px solid oklch(0.90 0.02 95 / 0.2);padding:0 0 0 0.55rem;
    transition:color .3s,border-color .3s;
  }
  .aihook.on{color:var(--ink)}
  .aihook.on .status{color:var(--gold);border-color:oklch(0.80 0.12 85 / 0.55)}
  
  body.lang-en #veil h1{letter-spacing:0.015em;text-indent:0}
  body.lang-en #wake h1,body.lang-en #whoask h2,body.lang-en #announce .word,
  body.lang-en #stateword .w,body.lang-en #again{letter-spacing:0.12em;text-indent:0}
  body.lang-en #enter,body.lang-en #chapter,body.lang-en #hint{letter-spacing:0.1em;text-indent:0}

  
  .hud{position:fixed;font-family:var(--font);color:var(--ink);z-index:20;user-select:none;pointer-events:none}
  #chapter{
    top:clamp(1rem,3vh,2.2rem);left:clamp(1.2rem,4vw,3rem);
    font-size:clamp(0.92rem,2vw,1.16rem);letter-spacing:0.13em;
    max-width:calc(100vw - 8rem);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    opacity:0.82;transform:rotate(-0.6deg);text-shadow:0 2px 18px oklch(0.1 0.02 220 / 0.9);
  }
  #stateword{
    bottom:clamp(1rem,3.5vh,2.4rem);left:clamp(1.2rem,4vw,3rem);
    min-width:min(23rem,44vw);padding:0.7rem 1.1rem 0.72rem 1rem;
    background:linear-gradient(90deg,oklch(0.08 0.025 220 / 0.7),oklch(0.08 0.025 220 / 0.18) 72%,transparent);
    border-left:1px solid oklch(0.82 0.09 88 / 0.32);
    opacity:0;transition:opacity 1s;pointer-events:none;
    text-shadow:0 2px 14px oklch(0.06 0.02 220 / 0.95);
  }
  #stateword.on{opacity:0.84}
  #stateword .w{font-size:clamp(1.05rem,2.5vw,1.42rem);letter-spacing:0.24em;transition:color .6s}
  #stateword .why{font-size:clamp(0.66rem,1.35vw,0.78rem);letter-spacing:0.07em;margin-top:0.3rem;opacity:0.84}
  #stateword.forming .why{color:var(--gold);opacity:0.96}
  #stateword .rules{display:grid;gap:0.13rem;margin-top:0.48rem;max-width:min(23rem,44vw);font-size:clamp(0.58rem,1.02vw,0.68rem);line-height:1.45;letter-spacing:0.045em;opacity:0.68}
  #stateword .rules span{display:block;white-space:nowrap}
  #stateword .rules b{color:var(--gold);font-weight:400}
  
  #journal{
    bottom:clamp(1rem,3.5vh,2.4rem);right:clamp(1.2rem,4vw,3rem);
    display:grid;gap:0.1rem;min-width:12rem;padding:0.68rem 0.95rem 0.68rem 1.7rem;
    font-size:clamp(0.72rem,1.4vw,0.86rem);letter-spacing:0.08em;text-align:right;
    background:linear-gradient(270deg,oklch(0.08 0.025 220 / 0.7),oklch(0.08 0.025 220 / 0.15) 72%,transparent);
    border-right:1px solid oklch(0.82 0.09 88 / 0.32);
    opacity:0;transform:rotate(0.8deg);transition:opacity 1.2s;
    text-shadow:0 2px 14px oklch(0.1 0.02 220 / 0.9);
  }
  #journal.on{opacity:0.86}
  #journal.changed{opacity:1}
  #journal .primary{font-size:0.86em;opacity:0.82}
  #journal .primary b{font-size:1.55em;letter-spacing:0.08em}
  #journal .secondary{opacity:0.78}
  #journal .tool{font-size:0.82em;opacity:0.62}
  #journal b{color:var(--gold);font-weight:400}
  
  #announce{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding-top:clamp(3.5rem,17vh,9rem);              
    font-family:var(--font);color:var(--ink);z-index:22;pointer-events:none;
    opacity:0;transition:opacity 0.45s ease-out;text-align:center;
  }
  #announce.show{opacity:1}
  body.notice-active #hint,body.notice-active #journal{opacity:0}
  #announce .word{
    font-size:clamp(3rem,9vw,5.4rem);letter-spacing:0.42em;text-indent:0.42em;
    text-shadow:0 0 44px oklch(0.1 0.02 220), 0 4px 22px oklch(0.1 0.02 220);
    transform:rotate(-1.4deg);
  }
  #announce .why{
    font-size:clamp(0.9rem,2vw,1.1rem);letter-spacing:0.24em;margin-top:1rem;opacity:0.85;
    max-width:min(38rem,calc(100vw - 2rem));line-height:1.6;padding:0 0.5rem;
    text-shadow:0 2px 16px oklch(0.1 0.02 220);
  }
  #hint{
    bottom:clamp(1rem,3.5vh,2.4rem);left:50%;transform:translateX(-50%) rotate(0.5deg);
    max-width:min(34rem,calc(100vw - 32rem));padding:0.42rem 0.85rem;
    font-size:clamp(0.78rem,1.65vw,0.9rem);letter-spacing:0.12em;opacity:0.76;
    background:linear-gradient(90deg,transparent,oklch(0.08 0.025 220 / 0.5) 18%,oklch(0.08 0.025 220 / 0.5) 82%,transparent);
    text-shadow:0 2px 14px oklch(0.06 0.02 220 / 0.95);
    transition:opacity 1.5s;white-space:nowrap;
  }
  #hint.compact{font-size:clamp(0.72rem,1.45vw,0.86rem);letter-spacing:0.16em;opacity:0.72}
  #hint.deep{color:var(--gold);opacity:0.9}
  #hint.guidance{color:oklch(0.88 0.08 150);opacity:0.94}
  #mute{
    position:fixed;top:clamp(1rem,3vh,2rem);right:clamp(1.2rem,3vw,2rem);z-index:25;
    width:2.9rem;height:2.9rem;border-radius:50%;cursor:pointer;
    background:oklch(0.16 0.03 200 / 0.55);border:1px solid oklch(0.93 0.02 95 / 0.25);
    color:var(--ink);font-size:1.15rem;font-family:var(--font);line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:transform .3s, border-color .3s;backdrop-filter:blur(4px);
  }
  #mute:hover{transform:rotate(-8deg) scale(1.08);border-color:oklch(0.80 0.12 85 / 0.6)}
  #mute.off{color:oklch(0.55 0.02 200);text-decoration:line-through}

  
  #whoask{
    position:fixed;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:1.3rem;z-index:26;
    background:oklch(0.1 0.02 220 / 0.74);backdrop-filter:blur(3px);
    font-family:var(--font);color:var(--ink);text-align:center;
    animation:whofade .6s ease-out;
  }
  #whoask.show{display:flex}
  @keyframes whofade{from{opacity:0}to{opacity:1}}
  #whoask h2{
    font-size:clamp(1.7rem,4.5vw,2.5rem);font-weight:400;
    letter-spacing:0.5em;text-indent:0.5em;transform:rotate(-1.2deg);
  }
  #whoask .q-sub{font-size:0.9rem;letter-spacing:0.2em;opacity:0.6;transform:rotate(0.6deg)}
  #whoask input{
    background:transparent;border:none;outline:none;
    border-bottom:1px solid oklch(0.80 0.12 85 / 0.7);
    font-family:var(--font);font-size:1.35rem;color:var(--ink);
    text-align:center;letter-spacing:0.24em;padding:0.35rem 1rem;
    width:min(60vw,15rem);
  }
  #whoask .btns{display:flex;gap:2.6rem}
  #whoask button{
    font-family:var(--font);background:transparent;border:none;cursor:pointer;
    color:oklch(0.75 0.04 160);font-size:1rem;letter-spacing:0.24em;
    border-bottom:1px dashed transparent;padding:0.2rem 0.3rem;transition:color .3s;
  }
  #whoask button:hover{color:var(--gold);border-bottom-color:oklch(0.80 0.12 85 / 0.5)}

  
  #wake{
    position:fixed;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:1.1rem;
    background:radial-gradient(ellipse at 50% 38%, oklch(0.97 0.025 92) 0%, oklch(0.88 0.05 82) 82%);
    color:oklch(0.32 0.045 250);font-family:var(--font);text-align:center;
    z-index:32;opacity:0;transition:opacity 2.2s ease-out;padding:2rem;
  }
  #wake.show{display:flex}
  #wake.on{opacity:1}
  #wake h1{
    font-size:clamp(2.4rem,7vw,4.4rem);font-weight:400;
    letter-spacing:0.5em;text-indent:0.5em;transform:rotate(-1deg);
  }
  #wake .epithet{
    font-size:clamp(1.05rem,2.6vw,1.35rem);letter-spacing:0.14em;
    color:oklch(0.42 0.09 60);transform:rotate(0.6deg);max-width:30ch;line-height:1.9;
  }
  #wake .stats{
    font-size:clamp(0.85rem,1.9vw,1rem);letter-spacing:0.22em;
    color:oklch(0.45 0.03 250);
  }
  #wake .wake-summary{display:grid;gap:0.7rem;width:min(34rem,88vw);margin-top:0.2rem}
  #wake .composition,#wake .tendency{font-size:clamp(0.92rem,2vw,1.05rem);letter-spacing:0.12em;line-height:1.65}
  #wake .composition{color:oklch(0.38 0.07 62)}
  #wake .tendency{color:oklch(0.38 0.055 205)}
  #wake .label{display:block;font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;opacity:0.62;margin-bottom:0.12rem}
  #wake .catline{
    font-size:clamp(0.9rem,2vw,1.05rem);letter-spacing:0.16em;
    color:oklch(0.5 0.04 300);margin-top:0.4rem;transform:rotate(-0.5deg);
  }
  #wake .coreline{
    font-size:clamp(0.8rem,1.8vw,0.95rem);letter-spacing:0.2em;
    color:oklch(0.48 0.07 200);transform:rotate(0.4deg);
  }
  #again{
    margin-top:1rem;font-family:var(--font);font-size:1.05rem;letter-spacing:0.4em;text-indent:0.4em;
    color:oklch(0.32 0.045 250);background:transparent;
    border:1px solid oklch(0.42 0.09 60 / 0.7);border-radius:50%;
    width:8.5rem;height:8.5rem;cursor:pointer;
    box-shadow:0 0 30px oklch(0.8 0.1 85 / 0.4), inset 0 0 22px oklch(0.8 0.1 85 / 0.22);
    transition:transform .5s, box-shadow .5s;
  }
  #again:hover{transform:scale(1.05) rotate(2deg)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
    #veil::before{transform:scale(1.008)}
    #veil,#wake,#announce,#stateword,#journal,#hint,canvas#stage{transition-duration:.18s}
  }
  @media (max-width:700px){
    #veil{padding:4.7rem 1.2rem 1.1rem;align-items:flex-start}
    .veil-stack{gap:1.2rem}
    #veil::before{background-position:60% center;filter:saturate(0.82) contrast(1.02) brightness(0.90)}
    #veil::after{background:linear-gradient(180deg,oklch(0.05 0.018 225 / 0.42),oklch(0.06 0.02 220 / 0.22) 50%,oklch(0.04 0.014 225 / 0.64))}
    #veil h1{gap:0.35rem;max-width:100%}
    #veil h1 .title-prelude{font-size:clamp(0.75rem,3.5vw,0.95rem);letter-spacing:0.38em}
    #veil h1 .title-main{font-size:clamp(3.5rem,16.5vw,5.2rem);line-height:0.9}
    #veil .sub{margin-top:1rem;font-size:0.94rem}
    #veil .premise{font-size:0.72rem;max-width:28rem}
    #chapter{top:1rem;left:0.8rem;max-width:calc(100vw - 5.4rem);font-size:0.88rem;letter-spacing:0.12em}
    #mute{top:0.7rem;right:0.7rem;width:2.5rem;height:2.5rem}
    #stateword{bottom:0.8rem;left:0.8rem;min-width:0;max-width:52vw;padding:0.55rem 0.75rem}
    #stateword .rules{max-width:18rem;font-size:0.58rem;letter-spacing:0.05em}
    #stateword .rules span{white-space:normal}
    #journal{bottom:0.8rem;right:0.8rem;font-size:0.68rem;letter-spacing:0.08em}
    #journal .tool{font-size:0.74em;opacity:0.56}
    #hint{bottom:1rem;max-width:42vw;font-size:0.72rem;letter-spacing:0.07em;overflow:hidden;text-overflow:ellipsis}
    #hint.compact{font-size:0.72rem;letter-spacing:0.1em}
    #announce .why{font-size:0.82rem;letter-spacing:0.1em}
  }
  @media (max-width:520px){
    #stateword{max-width:calc(100vw - 1.6rem)}
    #stateword .rules{max-width:calc(100vw - 1.6rem)}
    #hint{bottom:3.1rem}
    #journal{bottom:0.7rem}
    #veil{padding:4.4rem 1rem 0.9rem}
    #veil h1 .title-main{font-size:clamp(3.1rem,16vw,4.5rem)}
    #enter{min-height:4.5rem}
    #wake{gap:0.8rem;padding:1.2rem}
    #again{width:7.2rem;height:7.2rem}
  }
</style>
</head>
<body>

<canvas id="stage" role="img" aria-label="An Alice dreamscape that changes with how the player moves"></canvas>

<div id="veil">
  <div class="veil-stack">
    <div class="veil-brand">
      <h1><span class="title-prelude">Wandering</span><span class="title-main">Wonderland</span></h1>
      <div class="sub">Collect <b>seven pages of dream</b>. Find the sleeping bed.</div>
      <div class="premise">Your movement rewrites the dream.</div>
    </div>
    <div class="veil-menu" role="group" aria-label="Dream menu">
      <button id="enter">Enter the dream</button>
      <button id="aihook" class="aihook"></button>
    </div>
  </div>
</div>

<div id="chapter" class="hud"></div>
<div id="stateword" class="hud">
  <div class="w"></div>
  <div class="why"></div>
  <div class="rules"></div>
</div>
<div id="journal" class="hud"></div>
<div id="whoask">
  <h2>Who are YOU?</h2>
  <div class="q-sub">The caterpillar blows a smoke ring, and waits.</div>
  <input id="whoname" maxlength="16" autocomplete="off" spellcheck="false">
  <div class="btns">
    <button id="whoyes">This is my name</button>
    <button id="whono">I won't tell you</button>
  </div>
</div>
<div id="wake" role="dialog" aria-modal="true" aria-labelledby="wake-title">
  <h1 id="wake-title">AWAKE</h1>
  <div class="epithet"></div>
  <div class="wake-summary">
    <div class="composition"></div>
    <div class="tendency"></div>
  </div>
  <div class="stats"></div>
  <div class="catline"></div>
  <div class="coreline"></div>
  <button id="again">Dream again</button>
</div>
<div id="announce" aria-live="assertive" aria-atomic="true"><div class="word"></div><div class="why"></div></div>
<div id="hint" class="hud" aria-live="polite" aria-atomic="true">Follow the glowing tiles. A door waits at the end.</div>
<button id="mute" title="mute / unmute" aria-label="Mute or restore sound" hidden>♪</button>

<script>
'use strict';



const ASSETS = {};
function loadAsset(key, url){
  const img = new Image();
  img.onload = () => { ASSETS[key] = img; };
  img.src = url;
}


const SAVE = (() => {
  try { return JSON.parse(localStorage.getItem('wonderland-dream') || '{}'); }

const colorCache = new Map();
function okl(L, C, Hh, a = 1){
  const key = (L * 1000 | 0) + ',' + (C * 1000 | 0) + ',' + (Hh * 10 | 0) + ',' + (a * 100 | 0);
  let v = colorCache.get(key);
  if (v) return v;
  const hr = Hh * Math.PI / 180, A = C * Math.cos(hr), B = C * Math.sin(hr);
  let l = L + 0.3963377774 * A + 0.2158037573 * B;
  let m = L - 0.1055613458 * A - 0.0638541728 * B;
  let s = L - 0.0894841775 * A - 1.2914855480 * B;
  l **= 3; m **= 3; s **= 3;
  const g = x => { x = clamp(x, 0, 1); return x <= 0.0031308 ? 12.92 * x : 1.055 * x ** (1 / 2.4) - 0.055; };
  const r = Math.round(g( 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s) * 255);
  const gg = Math.round(g(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s) * 255);
  const b = Math.round(g(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s) * 255);
  v = `rgba(${r},${gg},${b},${a})`;
  if (colorCache.size > 6000) colorCache.clear();
  colorCache.set(key, v);
  return v;
}
const lerpHue = (a, b, t) => a + (((b - a + 540) % 360) - 180) * t;

const DREAM_MODEL = 'claude-haiku-4-5';
let nextDream = null;
let aiDream = null;
let dreamBusy = false, dreamFails = 0;
let motifHistory = [];
let motifEcho = null;                   // previous motif echo left in space
let motifStreak = 0;                    // repeated motif strengthens across pages
const DREAM_SYSTEM = `You are the dream itself, writing its next page. The dream is "Alice in Wonderland through an ADHD lens": a self-rewriting checkerboard dreamscape whose dreamer lives in three attention states (FOCUS / CURIOUS / ADRIFT). You will receive a JSON play-trace of how the dreamer has been spending their attention.
Return ONLY a raw JSON object, no code fences, shaped exactly:
{"chapter":"Chapter <number> · The <adjective> <place>","lines":["...","...","...","...","...","...","...","..."],"whispers":["...","..."],"scene":{"doors":2,"vines":"usual","extra":"none"},"motif":"clock"}
Rules:
- "chapter": the number must be unreasonable (Yesterday, Three-and-a-Half, Cat...); adjective and place dreamlike. Under 8 words total after "Chapter".
- "lines": 8 short pseudo-logical lines (each under 12 words) that doors, teacups, clocks and keys in this chapter might say.
- "whispers": 2 one-line temptations (each under 10 words) the dream murmurs to pull the dreamer's eyes away mid-walk; aim them at the weakness the trace reveals.
- "scene": THIS IS REAL: the next page of the world will be BUILT from it. "doors": 2, 3 or 4. "vines": "wild", "calm", or "usual". "extra": "mushrooms", "clocks", "teacups" or "none". Prescribe what this dreamer's attention needs.
- "motif": choose exactly one of "door", "clock", "tea", "mushroom", "vine". It is the image this page of the dream cannot stop repeating. Choose it from the trace, make the scene reinforce it, and let at least 4 of the 8 lines echo it indirectly. Never explain the motif or name the system behind it.
- Read "dream_motifs_recent" as the dream's memory. Repeating the latest motif should deepen it; changing motif should transform it, with at least 2 lines quietly bridging the previous image into the new one. Do not repeat one motif for more than 2 pages unless the trace strongly calls for it.
- THE PAGE MUST MIRROR THE TRACE: drifting often means dissolving, scattering, forgetting images; hoarding shards means keeping, pockets, collections; pushing doors in straight lines means roads, arrivals, hurry; kept watch at the bed means sleep, blankets, tenderness; refused the caterpillar a name means nameless things. Never quote numbers, never mention game mechanics.
- Lewis Carroll's register: self-consistent nonsense, tender, mischievous, never spooky.
- If the trace shows a name, you may hide it inside at most ONE line.`;
async function askDream(){
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: DREAM_MODEL,
      max_tokens: 400,
      system: DREAM_SYSTEM,
      messages: [{ role: 'user', content: JSON.stringify(buildTrace()) }],
    }),
  });
  if (!res.ok) throw new Error('api ' + res.status);
  const data = await res.json();
  const block = (data.content || []).find(b => b.type === 'text');
  let raw = (block ? block.text : '').trim();
  raw = raw.slice(raw.indexOf('{'), raw.lastIndexOf('}') + 1);
  const j = JSON.parse(raw);
  const lim = 90;
  const lines = (Array.isArray(j.lines) ? j.lines : [])
    .map(s => String(s).trim()).filter(s => s && s.length <= lim).slice(0, 8);
  const chapter = String(j.chapter || '').trim();
  if (!chapter || chapter.length > 64 || lines.length < 4)
    throw new Error('bad dream');
  const whispers = (Array.isArray(j.whispers) ? j.whispers : [])
    .map(s => String(s).trim()).filter(s => s && s.length <= lim).slice(0, 3);
  
  let scene = null;
  if (j.scene && typeof j.scene === 'object'){
    const doors = [2, 3, 4].includes(j.scene.doors | 0) ? j.scene.doors | 0 : 0;
    const vines = ['wild', 'calm', 'usual'].includes(j.scene.vines) ? j.scene.vines : 'usual';
    const extra = ['mushrooms', 'clocks', 'teacups', 'none'].includes(j.scene.extra) ? j.scene.extra : 'none';
    scene = { doors, vines, extra };
  }
  const motif = ['door', 'clock', 'tea', 'mushroom', 'vine'].includes(j.motif) ? j.motif : null;
  return { chapter, lines, whispers, scene, motif };
}
function prefetchDream(){
  if (!apiKey || dreamBusy || nextDream || dreamFails >= 3) return;
  dreamBusy = true;
  Promise.race([
    askDream(),
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 9000)),
  ]).then(d => { nextDream = d; dreamFails = 0; })
    .catch(() => { dreamFails++; })
    .finally(() => { dreamBusy = false; });
}

function consumeDream(){
  const incoming = nextDream;
  nextDream = null;
  aiDream = incoming;
  if (incoming && incoming.motif){
    const previous = motifHistory.length ? motifHistory[motifHistory.length - 1] : null;
    motifEcho = previous && previous !== incoming.motif ? previous : null;
    motifStreak = previous === incoming.motif ? motifStreak + 1 : 1;
    motifHistory.push(incoming.motif);
    if (motifHistory.length > 4) motifHistory.shift();
  } else {
    motifEcho = null;
    motifStreak = 0;
  }
  prefetchDream();
}
const NOUNS = ['the smile','the key','the tea','the door','the shadow','Thursday','the moon','the name','the stair','the rain','the rabbit','the echo'];
const TEMPLATES = [
  a => `${a[0]} is a rehearsal for ${a[1]}.`,
  a => `Read ${a[0]} backwards and you get ${a[1]}.`,
  a => `${a[0]} is lost; ${a[1]} still remembers it.`,
  a => `Don't trust ${a[0]}; yesterday it was ${a[1]}.`,
  a => `On the back of ${a[0]}, someone wrote the name of ${a[1]}.`,
  a => `Two more ${a[0]}s onward and you'll reach ${a[1]}. Probably.`,
];
let LINES = {};
function rewriteLines(){
  LINES = {};
  for (const type in CANON){
    const keep = [pick(CANON[type]), pick(CANON[type])];
    const remix = [];
    for (let i = 0; i < 2; i++){
      const a = pick(NOUNS); let b = pick(NOUNS);
      while (b === a) b = pick(NOUNS);
      remix.push(pick(TEMPLATES)([a, b]));
    }
    LINES[type] = keep.concat(remix);
  }
  
  if (aiDream && aiDream.lines.length >= 4){
    const pool = [...aiDream.lines].sort(() => Math.random() - 0.5);
    let k = 0;
    for (const type in LINES){
      if (type === 'caterpillar') continue;
      const take = [];
      for (let i = 0; i < 3; i++){ take.push(pool[k % pool.length]); k++; }
      LINES[type] = [pick(CANON[type])].concat(take);
    }
  }
}

    ? aiDream.chapter
    : `Chapter ${pick(CH_NUM)} · The ${pick(CH_A)} ${pick(CH_B)}`;

  if (REDUCED){ chapterEl.textContent = txt; return; }
  let frame = 0; const total = 16;

    frame++;
    const settled = Math.floor(txt.length * frame / total);

      out += txt[i] === ' ' || txt[i] === '·' ? txt[i] : SCRAMBLE[Math.random() * SCRAMBLE.length | 0];

  if (idleT > 3 && idleT < 4.45)
    guideOnce('adrift', 'Stillness is being read. The dream is beginning to drift.');

  for (const h of headings){ cx += Math.cos(h.a); cy += Math.sin(h.a); }

    smooth(3, 7, reversals.length)

  }

  let target, why;
  if (idleT > 4.5)                { target = 'chaos'; why = 'You drifted off — the dream carries on for you, and drops a few shards.'; }
  else if (reversals.length >= 7) { target = 'chaos'; why = 'So many ways at once? Then let it all scatter for a while.'; }
  else if (moveT > 1.6 && R > (T < focusEaseUntil ? 0.80 : 0.85)){ target = 'focus'; why = 'Steady steps — the path draws into one, and a door waits at its end.'; }

}

    if (!REDUCED) turnGhosts.push({
      x: player.x, y: player.y, t: T,
      from: { x: prevIn.x, y: prevIn.y },
      to: { x: inDir.x, y: inDir.y }
    });
  }
  if (mag > 0) prevIn = { x: inDir.x, y: inDir.y };

  const dashing = T < player.dashUntil;
  if (dashing){
    player.vx = player.dashDir.x * 920;
    player.vy = player.dashDir.y * 920;
    ghosts.push({ x: player.x, y: player.y, t: T, face: player.face });
  } else {
    const drowsy = T < slowUntil ? 0.45 : 1;
    const sizeSp = sizeTier() === 2 ? 0.85 : sizeTier() === 0 ? 1.15 : 1;
    const accel = 2400 * drowsy * sizeSp;
    player.vx += inDir.x * accel * dt;
    player.vy += inDir.y * accel * dt;
    const damp = Math.exp(-6 * dt);
    player.vx *= damp; player.vy *= damp;
    const sp = Math.hypot(player.vx, player.vy), maxSp = 340 * drowsy * sizeSp;
    if (sp > maxSp){ player.vx *= maxSp / sp; player.vy *= maxSp / sp; }
  }
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  if (Math.abs(player.vx) > 20) player.face = player.vx > 0 ? 1 : -1;
  player.walk += Math.hypot(player.vx, player.vy) * dt * 0.055;
  while (ghosts.length && ghosts[0].t < T - 0.3) ghosts.shift();
  while (turnGhosts.length && turnGhosts[0].t < T - 0.36) turnGhosts.shift();

  
  if (stateMix.chaos < 0.6){
    const pr = 13 * psize;
    if (sizeTier() !== 2) for (const b of bushes){
      if (b.dieT || b.bornT > T) continue;
      const bx = b.x + b.gapX * gateOpen, by = b.y + b.gapY * gateOpen;
      const dx = player.x - bx, dy = (player.y - by) * 1.6, d = Math.hypot(dx, dy), min = b.r + pr;
      if (d < min && d > 0.01){ const push = (min - d) / d; player.x += dx * push; player.y += dy * push * 0.6; }
    }
    for (const o of objects){
      if (o.dead || o.dying || o.bornT > T || o.type === 'cheshire' || o.type === 'key' || o.type === 'fragment') continue;
      const r = o.type === 'teaparty' ? 140 + pr : 26 * o.scale + pr;
      const dx = player.x - o.x, dy = (player.y - o.y) * 1.6, d = Math.hypot(dx, dy);
      if (d < r && d > 0.01){ const push = (r - d) / d; player.x += dx * push; player.y += dy * push * 0.6; }
    }
    
    if (stateMix.focus <= 0.6) for (const o of objects){
      if (o.type !== 'key' || !o.ward || o.dead || o.dying || o.bornT > T) continue;
      const dx = player.x - o.x, dy = (player.y - o.y) * 1.6, d = Math.hypot(dx, dy);
      if (d < o.wardR && d > 0.01){
        const pd = Math.min(o.wardR - d, 900 * dt);
        player.x += dx / d * pd; player.y += dy / d * pd * 0.62;
      }
    }
  }
  
  cam.x = lerp(cam.x, player.x + player.vx * 0.28, clamp(dt * 3.2, 0, 1));
  cam.y = lerp(cam.y, player.y + player.vy * 0.28 - 30, clamp(dt * 3.2, 0, 1));
  cam.tilt = lerp(cam.tilt, stateMix.chaos * Math.sin(T * 0.13) * 0.06 * MOTION, clamp(dt * 1.2, 0, 1));
  const sizeZoom = sizeTier() === 0 ? 0.08 : sizeTier() === 2 ? -0.06 : 0;
  cam.zoom = lerp(cam.zoom, 1 + stateMix.focus * 0.05 - stateMix.chaos * 0.05 + sizeZoom, clamp(dt, 0, 1));
}

function queueDialogue(d){
  const earliest = Number.isFinite(d.t0) ? d.t0 : T;
  d.t0 = Math.max(T, earliest, dialogueQueueEnd + 0.14, npcSuppressedUntil + 0.14);
  d.dur = d.dur || 3.8;
  dialogueQueueEnd = d.t0 + d.dur;
  dialogues.push(d);
  return d;
}
function refreshQueuedDialogue(d, text, dur){
  if (!dialogues.includes(d)){
    return queueDialogue({ ...d, text, t0: T, dur });
  }
  d.text = text;
  d.t0 = Math.max(T, d.t0);
  d.dur = dur;
  let end = d.t0 + d.dur;
  const ordered = dialogues.slice().sort((a, b) => a.t0 - b.t0);
  for (const next of ordered){
    if (next === d || next.t0 < d.t0) continue;
    next.t0 = Math.max(next.t0, end + 0.14);
    end = next.t0 + next.dur;
  }
  dialogueQueueEnd = Math.max(T, end);
  return d;
}

      drowse.focusBurn = 0; drowse.stunUntil = 0;
      drowse.x = player.x + Math.cos(a) * r;
      drowse.y = player.y + Math.sin(a) * r * 0.62;
      if (!drowse.warned){ drowse.warned = true; say('The drowse is catching up — walk steady a few steps to burn it off.'); }
    }
    return;
  }
  
  if (stateMix.focus > 0.6){
    drowse.focusBurn += dt;
    if (drowse.focusBurn > 3){

  if (sizeTier() === 2 && d < 70){

  }

function tickVines(dt){

    const hosts = objects.filter(o => !o.dead && !o.dying);
    const host = hosts.length ? pick(hosts) : null;
    if (host) spawnVine(host.x + rnd(-30, 30), host.y);
  }

  for (let i = vines.length - 1; i >= 0; i--){
    const v = vines[i];
    v.alpha = clamp(v.alpha + (growing ? dt * 1.2 : -dt * 0.55), 0, 1);
    if (!growing && v.alpha <= 0){ vines.splice(i, 1); continue; }
    if (growing && !v.done){
      v.ang += v.curl * dt * 0.9 + wob(v.seed, T, 0.5, 0.7) * dt;
      v.x += Math.cos(v.ang) * v.speed * dt;
      v.y += Math.sin(v.ang) * v.speed * dt * 0.62;
      const last = v.pts[v.pts.length - 1];
      if (Math.hypot(v.x - last[0], v.y - last[1]) > 7){

                       ang: v.ang + pick([-1, 1]) * rnd(0.5, 1.0),

function tileFlipProgress(i, j, tx, ty){
  
  let p = -1, useEpoch = epoch;
  if (wave){
    const front = (T - wave.t0) * (REDUCED ? 2600 : 640);
    const d = Math.hypot(tx - wave.x, (ty - wave.y) / 0.62);
    if (front - d > 140){ p = -1; useEpoch = epoch; }
    else if (front > d){ p = (front - d) / 140; useEpoch = p > 0.5 ? epoch : prevEpoch; }
    else { p = -1; useEpoch = prevEpoch; }
    if ((T - wave.t0) * 640 > 2600) wave = null;
  }
  return { p, useEpoch };
}
function drawTiles(){
  const pi = Math.round(player.x / TS / 2 + player.y / TS), pj = Math.round(player.y / TS - player.x / TS / 2);

  const ri = Math.ceil((W / cam.zoom) / TS / 2) + Math.ceil((H / cam.zoom) / TS) + 4;
  const fadeR = Math.max(W, H) * 0.62;
  const chaosF = stateMix.chaos;
  for (let di = -ri; di <= ri; di++){
    for (let dj = -ri; dj <= ri; dj++){
      const i = ci + di, j = cj + dj;
      const tx = (i - j) * TS, ty = (i + j) * TS * 0.5;
      const dxp = tx - player.x, dyp = (ty - player.y) / 0.62;
      const dist = Math.hypot(dxp, dyp);
      if (dist > fadeR + 140) continue;
      const sx = (tx - cam.x), sy = (ty - cam.y);
      if (Math.abs(sx) > W / 2 / cam.zoom + TS * 2 || Math.abs(sy) > H / 2 / cam.zoom + TS) continue;

      const key = i + ',' + j;
      
      let seen = seenMap.get(key);
      if (seen === undefined){ seen = T; seenMap.set(key, T); }
      const bornP = clamp((T - seen) / 0.5, 0, 1);

      const { p: waveP, useEpoch } = tileFlipProgress(i, j, tx, ty);
      
      let flipP = -1;
      const f = flipMap.get(key);
      if (f){
        flipP = (T - f.t0) / 0.6;
        if (flipP >= 1){ flipMap.delete(key); flipP = -1; }
      }
      const h = hash2(i, j, useEpoch);
      const checker = ((i + j) % 2 + 2) % 2;
      let scaleY = 1;
      if (!REDUCED && bornP < 1) scaleY = easeOut(bornP);
      if (!REDUCED && waveP >= 0 && waveP < 1) scaleY *= Math.abs(Math.cos(waveP * Math.PI));
      if (!REDUCED && flipP >= 0) scaleY *= Math.abs(Math.cos(flipP * Math.PI));

      const edge = smooth(fadeR + 120, fadeR - 160, dist);
      if (edge <= 0.01) continue;
      
      const lift = chaosF * (Math.sin(T * 0.7 + h * TAU) * 9 + 6) * MOTION;
      const base = checker ? cur.tileA : cur.tileB;
      
      const fog = smooth(fadeR * 0.28, fadeR + 100, dist) * 0.55;
      const L = lerp(base[0] + (h - 0.5) * 0.05, cur.void[0], fog);
      const C = lerp(base[1], cur.void[1], fog);
      const Hh = lerpHue(base[2], cur.void[2], fog);
      const odd = h > 0.965;
      ctx.save();
      ctx.translate(tx, ty - lift);
      ctx.scale(1, Math.max(scaleY, 0.02));
      ctx.beginPath();
      ctx.moveTo(0, -TS * 0.5 * 0.965);
      ctx.lineTo(odd ? TS * 0.5 : TS * 0.975, odd ? -TS * 0.12 : 0);
      ctx.lineTo(0, TS * 0.5 * 0.965);
      ctx.lineTo(-TS * 0.975, 0);
      ctx.closePath();
      ctx.fillStyle = okl(odd ? L + 0.07 : L, C, Hh, edge);
      ctx.fill();
      ctx.restore();
    }
  }
  
  const flipRate = (0.9 + chaosF * 5) * (REDUCED ? 0.3 : 1);   // random visible tile flips
  if (Math.random() < flipRate / 60){
    const di = (Math.random() * 20 | 0) - 10, dj = (Math.random() * 20 | 0) - 10;
    flipMap.set((ci + di) + ',' + (cj + dj), { t0: T });
  }
  if (seenMap.size > 6000){
    for (const [k] of seenMap){ seenMap.delete(k); if (seenMap.size <= 3000) break; }
  }
}


function drawPaths(){
  const aFocus = stateMix.focus, aCurio = stateMix.curio;
  if (aFocus < 0.03 && aCurio < 0.03) return;
  const doors = objects.filter(o => o.type === 'door' && !o.dead && !o.dying && o.bornT < T);
  
  if (dreamRipe) doors.unshift({ x: core.x, y: core.y, scale: 1.6, seed: 3 });
  if (!doors.length) return;
  if (!dreamRipe)
    doors.sort((a, b) => Math.hypot(a.x - player.x, a.y - player.y) - Math.hypot(b.x - player.x, b.y - player.y));
  const routes = [];
  if (aFocus > 0.03) routes.push({ door: doors[0], alpha: aFocus * 0.75 });
  if (aCurio > 0.03) for (let i = 0; i < Math.min(3, doors.length); i++)
    routes.push({ door: doors[i], alpha: aCurio * 0.3 });
  for (const rt of routes){
    const dx = rt.door.x - player.x, dy = rt.door.y - player.y;
    const dist = Math.hypot(dx, dy), steps = Math.floor(dist / (TS * 1.3));
    for (let k = 1; k < steps; k++){
      const t = k / steps;
      
      const sway = Math.sin(t * Math.PI) * (rt.alpha < 0.5 ? 90 : 14) * Math.sin(rt.door.seed);
      const px = player.x + dx * t - dy / dist * sway;
      const py = player.y + dy * t + dx / dist * sway * 0.62;
      const i = Math.round((px / TS + py / (TS * 0.5)) / 2);
      const j = Math.round((py / (TS * 0.5) - px / TS) / 2);
      const tx = (i - j) * TS, ty = (i + j) * TS * 0.5;
      const pulse = 0.55 + 0.45 * Math.sin(T * 3 - k * 0.55);
      const a = rt.alpha * pulse * smooth(0, 3, k) * smooth(steps, steps - 3, k);
      if (a < 0.02) continue;
      ctx.save();
      ctx.translate(tx, ty);
      ctx.beginPath();
      ctx.moveTo(0, -TS * 0.5 * 0.7); ctx.lineTo(TS * 0.7, 0);
      ctx.lineTo(0, TS * 0.5 * 0.7); ctx.lineTo(-TS * 0.7, 0);
      ctx.closePath();
      inkStroke(okl(...cur.glow, a), 2);          // path glow keeps gold reserved for collectibles
      ctx.stroke();
      ctx.fillStyle = okl(...cur.glow, a * 0.14);
      ctx.fill();
      ctx.restore();
    }
    
    ctx.save();
    ctx.translate(rt.door.x, rt.door.y);
    ctx.beginPath(); ctx.ellipse(0, 4, 52 * rt.door.scale, 18 * rt.door.scale, 0, 0, TAU);
    ctx.fillStyle = okl(...cur.glow, rt.alpha * 0.3 * (0.6 + 0.4 * Math.sin(T * 2)));
    ctx.fill();
    ctx.restore();
  }
}


function drawWards(){
  for (const o of objects){
    if (o.type !== 'key' || !o.ward || o.dead || o.dying || o.bornT > T) continue;
    const a = (1 - stateMix.focus) * 0.5 + 0.06;
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.setLineDash([10, 14]);
    ctx.lineDashOffset = -T * 26;
    inkStroke(okl(...cur.glow, a), 2.2);
    ctx.beginPath(); ctx.ellipse(0, 0, o.wardR, o.wardR * 0.62, 0, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

  ctx.bezierCurveTo(b.r * 0.48, b.r * 0.08, -b.r * 0.52, b.r * 0.1, -b.r * 0.92, -b.r * 0.18);
  ctx.closePath();

function drawObject(o){
  const grow = o.bornT > T ? 0 : clamp((T - o.bornT) / 0.9, 0, 1);
  let die = 0;
  if (o.dying){
    die = clamp((T - o.dying) / 0.7, 0, 1);
    if (die >= 1){ o.dead = true; return; }
  }
  if (grow <= 0) return;
  const g = easeOut(grow), d = die;
  const wf = 1 / Math.sqrt(Math.max(o.scale, 0.3));
  const floatAmp = (1.5 + stateMix.curio * 3 + stateMix.chaos * 22) * MOTION;
  const fy = Math.sin(T * o.floatFreq * wf + o.floatPhase) * floatAmp - stateMix.chaos * 18 * MOTION;
  const rot = o.lean * (1 - stateMix.focus * 0.8)
            + wob(o.seed, T, 0.04 + stateMix.chaos * 0.24, 0.4 * wf) * MOTION
            + d * 2.4 * MOTION;
  const s = o.scale * (REDUCED ? 1 : g * (1 - d));
  const dist = Math.hypot(o.x - player.x, (o.y - player.y) / 0.62);
  
  const distA = 0.2 + 0.8 * smooth(Math.max(W, H) * 0.92, Math.max(W, H) * 0.34, dist);
  
  let reveal = 1;
  if (o.type === 'key'){
    reveal = smooth(0.22, 0.62, stateMix.curio);
    if (reveal <= 0.02) return;
  }
  ctx.save();
  ctx.translate(o.x, o.y);
  
  const lift = Math.max(0, -fy);
  const shS = Math.max(0.45, 1 - lift / 90);
  const shA = Math.max(0.05, 0.3 * (1 - lift / 70)) * (1 - stateMix.chaos * 0.5) * distA;
  ctx.beginPath(); ctx.ellipse(0, 2, 40 * s * shS, 13 * s * shS, 0, 0, TAU);
  ctx.fillStyle = okl(0.08, 0.02, 230, shA); ctx.fill();
  
  if (o.lureUntil > T){
    const lp = 0.5 + 0.5 * Math.sin(T * 9);
    ctx.save();
    ctx.shadowColor = okl(...cur.accent, 0.9); ctx.shadowBlur = 26 * lp;
    inkStroke(okl(...cur.accent, 0.45 + 0.35 * lp), 2.2);
    ctx.beginPath(); ctx.ellipse(0, 2, 54 * s, 17 * s, 0, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  ctx.translate(0, fy);
  ctx.rotate(rot);
  ctx.scale(s, s);
  strokeComp = 1 / Math.sqrt(Math.max(o.scale, 0.25));
  const baseAlpha = (1 - d) * (0.35 + 0.65 * g) * distA * reveal;
  
  if (o.memoryEcho){
    ctx.save();
    const echoShift = REDUCED ? 3 : 3 + Math.sin(T * 0.9 + o.seed) * 2 * MOTION;
    ctx.translate(echoShift, -2);
    ctx.globalAlpha = baseAlpha * (REDUCED ? 0.16 : 0.12 + 0.04 * Math.sin(T * 1.1 + o.seed));
    if (ASSETS[o.type]) drawAsset(ASSETS[o.type], 1);
    else DRAW[o.type](o);
    ctx.restore();
  }
  ctx.globalAlpha = baseAlpha * (o.memoryEcho ? 0.72 : 1);
  if (ASSETS[o.type]) drawAsset(ASSETS[o.type], 1);
  else DRAW[o.type](o);
  strokeComp = 1;
  ctx.restore();
}

    }
    
    // Bulbous teapot with a real handle, lid and curled spout.
    ctx.beginPath();
    ctx.moveTo(-20, -49); ctx.bezierCurveTo(-19, -66, -9, -72, 3, -71);

    const potFill = ctx.createLinearGradient(-20, -65, 22, -46);

    ctx.fillStyle = potFill; ctx.fill(); inkStroke(ink, 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -70, 11, 3.5, 0, 0, TAU);
    ctx.fillStyle = okl(0.78, 0.09, 58); ctx.fill(); inkStroke(ink, 1.4); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -75, 3.4, 0, TAU); ctx.fillStyle = okl(0.78, 0.11, 82); ctx.fill(); inkStroke(ink, 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(18, -60); ctx.bezierCurveTo(34, -62, 35, -72, 46, -76);
    ctx.quadraticCurveTo(39, -62, 23, -50); inkStroke(ink, 2.4); ctx.stroke();
    ctx.beginPath(); ctx.arc(-19, -58, 12, Math.PI * 0.56, Math.PI * 1.55);
    inkStroke(ink, 3.4); ctx.stroke();
    inkStroke(okl(0.90, 0.035, 90, 0.5), 1.1);
    ctx.beginPath(); ctx.arc(1, -56, 7, 0.25, 2.8); ctx.stroke();
    inkStroke(okl(...cur.ink, 0.4), 1.5);
    ctx.beginPath();
    ctx.moveTo(45, -77);
    for (let k = 1; k <= 3; k++)
      ctx.quadraticCurveTo(45 + wob(o.seed + k, T, 5, 1.3), -77 - k * 11 + 5,
                           45 + wob(o.seed, T + k, 3, 1), -77 - k * 11);
    ctx.stroke();
    
    ctx.save();
    ctx.translate(96, -70);
    ctx.rotate(0.12 + wob(o.seed, T, 0.03, 0.4));

    ctx.fillStyle = okl(...cur.ink, 0.92); ctx.fill();
    inkStroke(okl(0.2, 0.03, 220, 0.9), 1.6); ctx.stroke();
    inkStroke(okl(0.2, 0.03, 220, 0.9), 1.8);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(1.56) * 6, Math.sin(1.56) * 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(4.61) * 10, Math.sin(4.61) * 10); ctx.stroke();

  },
  cheshire(o){
    const faceA = (0.35 + 0.65 * Math.abs(Math.sin(T * 0.21 + o.seed)))
                * (1 - stateMix.chaos * 0.92);
    const ink = okl(...cur.ink);
    const outlineA = 0.16 * stateMix.focus;
    if (outlineA > 0.02){
      inkStroke(okl(...cur.ink, outlineA), 1.4);
      ctx.setLineDash([6, 14]);
      ctx.beginPath(); ctx.arc(0, -30, 72, Math.PI * 1.15, Math.PI * 1.75); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -30, 72, Math.PI * 0.1, Math.PI * 0.55); ctx.stroke();

      ctx.beginPath(); ctx.moveTo(-58, -78); ctx.lineTo(-44, -108); ctx.lineTo(-28, -84); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(58, -78); ctx.lineTo(44, -108); ctx.lineTo(28, -84); ctx.stroke();
    }
    if (faceA > 0.02){
      const dx = player.x - o.x, dy = player.y - o.y;
      const dist = Math.hypot(dx, dy) || 1;
      const lx = dx / dist * 4, ly = dy / dist * 3;
      const blink = Math.max(0.12, Math.abs(Math.sin(T * 0.7 + o.seed * 3)) > 0.06 ? 1 : 0.12);

        ctx.fillStyle = okl(0.15, 0.02, 220, faceA); ctx.fill();

      }

    const sw = 62;
    ctx.save();
    ctx.rotate(wob(o.seed, T, 0.04, 0.35));
    ctx.shadowColor = okl(...cur.glow, 0.55); ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(-sw, -18);

      ctx.beginPath(); ctx.moveTo(tx, topY + 6); ctx.lineTo(tx, botY - 4); ctx.stroke();
    }
    ctx.restore();
  },
};


function drawPlayerChar(px, py, face, walk, alpha, dashing){
  ctx.save();
  ctx.translate(px, py);
  ctx.scale(psize * 1.55, psize * 1.55);
  ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.ellipse(0, 2, 18, 6, 0, 0, TAU);
  ctx.fillStyle = okl(0.08, 0.02, 230, 0.35 * alpha); ctx.fill();
  if (ASSETS.player){ ctx.scale(face, 1); drawAsset(ASSETS.player, 1); ctx.restore(); return; }

  const moving = Math.hypot(player.vx, player.vy) > 40;
  const swing  = moving ? Math.sin(walk) * 7 : 0;
  const bob    = moving ? Math.abs(Math.sin(walk)) * 2.5 : 0;
  ctx.translate(0, -bob);
  ctx.scale(face, 1);
  if (dashing) ctx.transform(1, 0, -0.24, 1, 0, 0);

  const ink    = okl(0.22, 0.03, 230, 0.95);
  const blue   = okl(0.60, 0.105, 250);
  const blueSh = okl(0.49, 0.10, 250);

  const hairSh = okl(0.68, 0.115, 85);

  // Striped stockings and separate shoes make the walk cycle readable at small scale.
  for (const [x, step] of [[-3.2, swing * 0.52], [3.2, -swing * 0.52]]){
    ctx.beginPath();
    ctx.moveTo(x - 1.8, -13); ctx.lineTo(x - 1.4 + step, -2);
    ctx.lineTo(x + 1.5 + step, -2); ctx.lineTo(x + 1.8, -13); ctx.closePath();
    ctx.fillStyle = cream; ctx.fill(); inkStroke(ink, 1.15); ctx.stroke();
    inkStroke(blueSh, 1.1);
    ctx.beginPath(); ctx.moveTo(x - 1.6 + step * 0.4, -7.5); ctx.lineTo(x + 1.6 + step * 0.4, -7.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 1.5 + step * 0.72, -4.5); ctx.lineTo(x + 1.5 + step * 0.72, -4.5); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x + step, -0.8, 3.4, 1.8, -0.08, 0, TAU);
    ctx.fillStyle = ink; ctx.fill();
  }

  // Hair mass and ribbon sit behind the dress, giving Alice a fuller silhouette.
  ctx.beginPath();
  ctx.moveTo(-8, -38); ctx.bezierCurveTo(-13, -34, -12, -25, -8, -23);
  ctx.quadraticCurveTo(-4, -28, 0, -25);
  ctx.quadraticCurveTo(5, -29, 9, -24);
  ctx.bezierCurveTo(13, -28, 12, -36, 7, -40);
  ctx.closePath(); ctx.fillStyle = hairSh; ctx.fill();
  inkStroke(ink, 1.35); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8, -39); ctx.lineTo(13, -43); ctx.lineTo(12, -36); ctx.closePath();
  ctx.fillStyle = blueSh; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9, -39); ctx.lineTo(15, -35); ctx.lineTo(10, -33); ctx.closePath();
  ctx.fillStyle = blue; ctx.fill(); ctx.stroke();

  // Petticoat first, then the blue dress and apron, so the hem has real depth.
  ctx.beginPath();
  ctx.moveTo(-11.8 - swing * 0.14, -12);
  for (let i = 0; i < 4; i++){
    const x0 = -11.8 + i * 5.9;
    ctx.quadraticCurveTo(x0 + 2.95, -7.2 - (i % 2) * 0.7, x0 + 5.9, -12);
  }
  ctx.lineTo(7, -18); ctx.lineTo(-7, -18); ctx.closePath();
  ctx.fillStyle = cream; ctx.fill(); inkStroke(ink, 1.2); ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-6.5, -30);
  ctx.quadraticCurveTo(-14 - swing * 0.2, -17, -12.5 - swing * 0.15, -10.5);
  ctx.quadraticCurveTo(0, -13.2, 12.5 + swing * 0.15, -10.5);
  ctx.quadraticCurveTo(14 + swing * 0.2, -17, 6.5, -30);
  ctx.closePath();
  const dressFill = ctx.createLinearGradient(-12, -28, 12, -12);
  dressFill.addColorStop(0, blueSh); dressFill.addColorStop(0.48, blue); dressFill.addColorStop(1, okl(0.53, 0.11, 250));
  ctx.fillStyle = dressFill; ctx.fill(); inkStroke(ink, 1.8); ctx.stroke();
  inkStroke(okl(0.79, 0.055, 245, 0.42), 0.85);
  for (const x of [-7, 0, 7]){
    ctx.beginPath(); ctx.moveTo(x * 0.58, -27); ctx.quadraticCurveTo(x, -18, x * 1.15, -12); ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(-4.8, -28.5); ctx.quadraticCurveTo(-7.2, -18, -7.3, -11.8);
  ctx.quadraticCurveTo(0, -14.5, 7.3, -11.8);
  ctx.quadraticCurveTo(7.2, -18, 4.8, -28.5); ctx.closePath();
  ctx.fillStyle = cream; ctx.fill();
  inkStroke(okl(0.38, 0.025, 235, 0.58), 1.05); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4.3, -28.8); ctx.lineTo(-2.2, -32); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4.3, -28.8); ctx.lineTo(2.2, -32); ctx.stroke();
  ctx.beginPath(); ctx.arc(2.2, -18, 2.4, Math.PI, TAU); ctx.stroke();

  // Puff sleeves, skin-toned arms and tiny hands break the old stick-figure look.
  for (const side of [-1, 1]){
    ctx.save(); ctx.translate(side * 7, -27.5); ctx.rotate(side * 0.28);
    ctx.beginPath(); ctx.ellipse(0, 0, 4.3, 3.7, 0, 0, TAU);
    ctx.fillStyle = blue; ctx.fill(); inkStroke(ink, 1.25); ctx.stroke(); ctx.restore();
    const handX = side * (10.8 + swing * 0.38);

    ctx.beginPath(); ctx.moveTo(side * 8.5, -25.5); ctx.quadraticCurveTo(side * 10.5, -21, handX, -17); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(side * 8.5, -25.5); ctx.quadraticCurveTo(side * 10.5, -21, handX, -17); ctx.stroke();
    ctx.beginPath(); ctx.arc(handX, -16.4, 1.5, 0, TAU); ctx.fillStyle = skin; ctx.fill(); inkStroke(ink, 0.8); ctx.stroke();
  }

  ctx.beginPath(); ctx.rect(-2.6, -33, 5.2, 5.2);
  ctx.fillStyle = skin; ctx.fill(); inkStroke(ink, 1); ctx.stroke();

  // Face, curls and headband carry the recognisable Alice identity.
  ctx.beginPath(); ctx.ellipse(-0.5, -38.2, 9.8, 10.4, -0.04, 0, TAU);
  ctx.fillStyle = hair; ctx.fill(); inkStroke(hairSh, 1.45); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0.7, -37.2, 7.7, 8.2, -0.04, 0, TAU);
  ctx.fillStyle = skin; ctx.fill(); inkStroke(ink, 1.35); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-8.4, -39.4); ctx.quadraticCurveTo(-4.7, -47, 4.8, -43.3);
  ctx.quadraticCurveTo(2.3, -40.8, -0.5, -39.6);
  ctx.quadraticCurveTo(-4, -38.2, -8.4, -39.4); ctx.closePath();
  ctx.fillStyle = hair; ctx.fill(); inkStroke(hairSh, 1.05); ctx.stroke();
  for (const side of [-1, 1]){
    ctx.beginPath();
    ctx.moveTo(side * 7.5, -38.5); ctx.quadraticCurveTo(side * 11.4, -33, side * 7.1, -27);
    ctx.quadraticCurveTo(side * 5.4, -31, side * 5.8, -36); ctx.closePath();
    ctx.fillStyle = hair; ctx.fill(); inkStroke(hairSh, 1.05); ctx.stroke();
  }
  inkStroke(cream, 1.85);
  ctx.beginPath(); ctx.arc(-0.4, -38.2, 8.8, Math.PI * 1.05, Math.PI * 1.9); ctx.stroke();

  ctx.fillStyle = ink;
  ctx.beginPath(); ctx.ellipse(3.7, -36.5, 1.25, 1.45, 0, 0, TAU); ctx.fill();
  inkStroke(okl(0.40, 0.04, 28, 0.72), 0.7);
  ctx.beginPath(); ctx.moveTo(5.1, -34.7); ctx.quadraticCurveTo(6.4, -34, 5.2, -33.2); ctx.stroke();
  ctx.beginPath(); ctx.arc(2.8, -32.8, 2.2, 0.25, 1.2); ctx.stroke();
  ctx.beginPath(); ctx.arc(5.4, -38.2, 1.8, Math.PI * 1.05, Math.PI * 1.55); ctx.stroke();
  ctx.restore();
}


function drawVines(){
  for (const v of vines){
    if (v.pts.length < 2) continue;
    // Dark under-stroke gives the vine the same inked edge as props and characters.
    inkStroke(okl(0.18, 0.045, 145, v.alpha * 0.72), 4.8);
    ctx.beginPath();
    ctx.moveTo(v.pts[0][0], v.pts[0][1]);
    for (let i = 1; i < v.pts.length - 1; i++){
      const midx = (v.pts[i][0] + v.pts[i + 1][0]) / 2, midy = (v.pts[i][1] + v.pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(v.pts[i][0], v.pts[i][1], midx, midy);
    }
    ctx.stroke();
    inkStroke(okl(0.48, 0.105, 148, v.alpha * 0.92), 2.5);
    ctx.beginPath();
    ctx.moveTo(v.pts[0][0], v.pts[0][1]);
    for (let i = 1; i < v.pts.length - 1; i++){
      const midx = (v.pts[i][0] + v.pts[i + 1][0]) / 2, midy = (v.pts[i][1] + v.pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(v.pts[i][0], v.pts[i][1], midx, midy);
    }
    ctx.stroke();
    for (const [lx, ly, la, ls] of v.leaves){
      ctx.save(); ctx.translate(lx, ly); ctx.rotate(la + wob(lx, T, 0.15, 0.8) * MOTION);
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.quadraticCurveTo(ls * 0.8, -ls * 0.7, ls * 2, 0);
      ctx.quadraticCurveTo(ls * 0.8, ls * 0.7, 0, 0); ctx.closePath();
      ctx.fillStyle = okl(0.56, 0.115, 143, v.alpha * 0.86); ctx.fill();
      inkStroke(okl(0.18, 0.045, 145, v.alpha * 0.62), 0.9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ls * 0.15, 0); ctx.lineTo(ls * 1.65, 0); ctx.stroke();
      ctx.restore();
    }
    if (!v.done && v.alpha > 0.5){
      ctx.save();
      ctx.translate(v.x, v.y);
      for (let i = 0; i < 3; i++){
        ctx.save(); ctx.rotate(i * TAU / 3 + T * 0.08 * MOTION);
        ctx.beginPath(); ctx.ellipse(0, -3.5, 2.2, 4.2, 0, 0, TAU);
        ctx.fillStyle = okl(0.74, 0.10, 86, v.alpha * 0.9); ctx.fill();
        ctx.restore();
      }
      ctx.beginPath(); ctx.arc(0, 0, 1.8, 0, TAU);
      ctx.fillStyle = okl(0.35, 0.07, 60); ctx.fill();
      ctx.restore();
    }
  }
}
function drawParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.age += dt;
    if (p.age >= p.life){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy -= 12 * dt;
    const a = 1 - p.age / p.life;
    if (p.kind === 'bloom'){
      
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.age * 4 + p.size * 7);
      const r2 = p.size * a * 1.7;
      ctx.beginPath();
      ctx.moveTo(0, -r2);
      ctx.quadraticCurveTo(r2 * 0.75, 0, 0, r2);
      ctx.quadraticCurveTo(-r2 * 0.75, 0, 0, -r2);
      ctx.fillStyle = okl(...cur.accent, a); ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, TAU);
      ctx.fillStyle = okl(...cur.glow, a * 0.9);
      ctx.fill();
    }
  }
  for (const m of motes){
    const dx = player.x - m.x, dy = player.y - m.y;
    const dist = Math.hypot(dx, dy) || 1;
    const pull = stateMix.focus * 22 / Math.max(dist * 0.02, 1);
    m.x += (m.vx + dx / dist * pull) * dt;
    m.y += (m.vy + dy / dist * pull) * dt;
    if (dist > 1100 || dist < 14){ m.x = player.x + rnd(-800, 800); m.y = player.y + rnd(-500, 500); }
    const tw = 0.22 + 0.3 * Math.abs(Math.sin(T * 0.8 + m.seed));
    ctx.beginPath(); ctx.arc(m.x, m.y, 1.6, 0, TAU);
    ctx.fillStyle = okl(...cur.ink, tw); ctx.fill();
  }
}
function wrapDialogueText(text, maxWidth){
  const units = String(text).match(/[\u3400-\u9fff]|[^\u3400-\u9fff\s]+\s*|\s+/gu) || [String(text)];
  const lines = [''];
  let overflow = false;
  for (const unit of units){
    const candidate = lines[lines.length - 1] + unit;
    if (!lines[lines.length - 1] || ctx.measureText(candidate).width <= maxWidth){
      lines[lines.length - 1] = candidate;
    } else if (lines.length < 2){
      lines.push(unit.trimStart());
    } else {
      overflow = true;
      break;
    }
  }
  if (overflow){
    lines[1] = lines[1].trimEnd();
    while (lines[1] && ctx.measureText(lines[1] + '。').width > maxWidth)
      lines[1] = lines[1].slice(0, -1);
    lines[1] += '。';
  }
  return lines.map(line => line.trim());
}
function drawDialogues(){
  if (T < npcSuppressedUntil) return;
  for (let i = dialogues.length - 1; i >= 0; i--)
    if ((T - dialogues[i].t0) / dialogues[i].dur >= 1) dialogues.splice(i, 1);

  const d = dialogues.filter(item => T >= item.t0).sort((a, b) => a.t0 - b.t0)[0];
  if (!d) return;
  const p = clamp((T - d.t0) / d.dur, 0, 1);
  const a = p < 0.12 ? p / 0.12 : p > 0.75 ? (1 - p) / 0.25 : 1;
  const rise = easeOut(Math.min(p * 3, 1)) * 16;
  const screenFont = W < 620 ? 18 : 20;
  const lineHeight = (screenFont + 7) / cam.zoom;
  ctx.font = `${screenFont / cam.zoom}px ${FONTF}`;
  const lines = wrapDialogueText(d.text, Math.min(520, W - 64) / cam.zoom);

  const dx = (d.x - cam.x) * cam.zoom, dy = (d.y - rise - cam.y) * cam.zoom;
  const c = Math.cos(cam.tilt), s = Math.sin(cam.tilt);
  const desiredX = W / 2 + dx * c - dy * s;
  const desiredY = H / 2 + dx * s + dy * c;
  const halfWidth = Math.min(260, (W - 64) / 2);
  const safe = screenToWorld(clamp(desiredX, 32 + halfWidth, W - 32 - halfWidth),
                             clamp(desiredY, 66, H - 104));

  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const padX = 16 / cam.zoom, padY = 10 / cam.zoom;
  const bubbleW = Math.max(...lines.map(line => ctx.measureText(line).width)) + padX * 2;
  const bubbleH = lines.length * lineHeight + padY * 1.3;
  const linkDist = Math.hypot(safe.x - d.x, safe.y - d.y);
  if (linkDist > 36 / cam.zoom){
    ctx.setLineDash([3 / cam.zoom, 6 / cam.zoom]);
    ctx.strokeStyle = okl(...cur.ink, a * 0.22);
    ctx.lineWidth = 1 / cam.zoom;

      ? okl(0.46, 0.08, 310, a * 0.11)

  if (transitionFx.type === 'page'){
    const origin = worldToScreen(transitionFx.x, transitionFx.y);
    ctx.save();
    ctx.translate(origin.x, origin.y);
    for (let i = 0; i < 5; i++){
      const q = clamp((p - i * 0.055) / 0.72, 0, 1);
      if (!q) continue;
      ctx.save();
      ctx.rotate((i - 2) * 0.13 + q * 0.18);
      ctx.scale(0.06 + q * 1.08, 0.18 + Math.sin(q * Math.PI * 0.5) * 0.9);

      ctx.strokeRect(-W * 0.58, -H * 0.12, W * 1.16, H * 0.24);

    }
    ctx.restore();
  } else if (transitionFx.type === 'rewrite'){
    const origin = worldToScreen(transitionFx.x, transitionFx.y);
    ctx.save();
    ctx.strokeStyle = okl(0.72, 0.11, 310, a * 0.34);
    for (let i = 0; i < 4; i++){
      const q = clamp(p * 1.35 - i * 0.13, 0, 1);

    }

  }
}

let lastFrame = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;
  T += dt;
  if (started && !waking) stateSeconds[state] += dt;

  if (started){
    tickPlayer(dt);
    if (!waking){
      updateAttention(dt);
      if (state === 'chaos' && !deepFall && T - lastRewrite > 6) rewriteWorld(true);
      tickParty(dt);
      if (!dreamRipe && dreamPages() >= PAGES_NEEDED && !playerAtParty()) ripen();
      
      if (choiceZones){
        for (const key in choiceZones){
          const z = choiceZones[key];
          if (Math.hypot(player.x - z.x, (player.y - z.y) / 0.62) < 45){
            if (key === 'wake') wake(); else tuckIn();
            choiceZones = null;
            break;
          }
        }
      }
    }
    tickDrowse(dt);
    tickCore(dt);
    tickLure();
  }
  const tgt = { focus: 0, curio: 0, chaos: 0 }; tgt[state] = 1;
  for (const k in stateMix) stateMix[k] = lerp(stateMix[k], tgt[k], clamp(dt * 1.6, 0, 1));
  tickPalette(waking ? PALETTES.wake : PALETTES[state], dt);
  psize = lerp(psize, psizeTarget, clamp(dt * 2.5, 0, 1));
  gateOpen = lerp(gateOpen, stateMix.curio, clamp(dt * 1.5, 0, 1));

  
  if (started && !waking) for (const o of objects){
    if (o.dead || o.bornT > T) continue;
    const d = Math.hypot(o.x - player.x, (o.y - player.y) / 0.62);
    if (o.type === 'door' && d < 300)
      guideOnce('focus-door', 'Move steadily. Focus draws the route together and opens the door.');
    if (o.type === 'fragment'){
      if ((!o.dying || T < o.dying) && !o.grabbed && d < 48){
        o.grabbed = true; o.dying = T; fragmentsHeld++; fragmentsTotal++; updateJournal();
        burst(o.x, o.y - 20, 14, 'bloom');
        say(pick(FRAG_LINES));
        registerInteraction();
      }
      continue;
    }
    if (o.dying) continue;
    if (o.type === 'key'){
      if (stateMix.curio > 0.45 && d < 520)
        guideOnce('curiosity-hidden', 'Curiosity lets hidden things breathe into view. Focus may hide them again.');
      if (!wardHinted && o.ward && d < o.wardR + 170){
        wardHinted = true;
        say('Hush-wall: Curious eyes see the key; only Focus can enter, but Focus can’t see it. Remember where it is first.');
      }
      if (d < 52){
        o.dying = T; keysHeld++; updateJournal();
        burst(o.x, o.y - 40, 16, 'bloom');
        say(stateMix.curio > 0.5 ? 'The key gives a little tug: it knows you.'
                                 : 'You remembered where it was. The key likes being remembered.');
        registerInteraction();
      }
      continue;
    }
    if (o.type === 'caterpillar'){
      if (!SAVE.playerName && !asking && !nameAskedThisRun && d < 120){
        askName();
        continue;
      }
      if (d < 110) tryTalk(o);
      continue;
    }
    if (o.type === 'mushroom'){
      if (!mushHinted && d < 170 * Math.max(o.scale, 0.8)){
        mushHinted = true;
        say('Mushroom: a bite from the left makes you bigger, from the right smaller. Walk up slowly; don’t barge in.');
      }
      
      if (d < 52 * Math.max(o.scale, 0.7) && T - (o.lastBite || -9) > 4
          && Math.hypot(player.vx, player.vy) < 130){
        biteMushroom(o, player.x < o.x ? 'L' : 'R');
        continue;
      }
      if (d < 110 * Math.max(o.scale, 0.8)) tryTalk(o);
      continue;
    }
    if (o.type === 'mirrordoor'){
      if (d < 26 * o.scale + 60){
        
        if (sizeTier() === 0 || o.mercy){ climbBack(o); continue; }
        if (T - (o.lastTalk || -9) > 5){
          o.lastTalk = T;
          queueDialogue({ text: 'This door is small and only admits small guests — the right side of a mushroom can help.',
                          x: o.x, y: o.y - 100 * o.scale, t0: T, dur: 3.6, seed: rnd(100) });
        }
      }
      continue;
    }
    if (o.type === 'door' && o.vineAmt > 0.05 && d < 26 * o.scale + 70 && stateMix.focus <= 0.5){
      
      if (T - o.lastTalk > 6){
        o.lastTalk = T;
        queueDialogue({ text: 'The door is bound in vines. Come at it in a straight line — vines fear focused eyes.',
                        x: o.x, y: o.y - 120 * o.scale, t0: T, dur: 3.6, seed: rnd(100) });
      }
      continue;
    }
    if (o.type === 'door' && d < 26 * o.scale + 46 && stateMix.focus > 0.5){
      
      if (o.vineAmt > 0.5){
        if (!o.vineClearing){
          o.vineClearing = true;
          say('The vines loosen under your focused gaze.');
          burst(o.x, o.y - 60 * o.scale, 14, 'bloom');
        }
        continue;
      }
      
      const tier = sizeTier();
      const fits = tier === 0 || o.scale > 1.8 || (tier === 1 && o.scale >= 0.7);
      if (fits){ passDoor(o); continue; }
      if (T - o.lastTalk > 6){
        o.lastTalk = T;
        queueDialogue({ text: tier === 2 ? 'You’re too big to fit. Go nibble the right side of a mushroom.'
                                         : 'This door only admits smaller guests.',
                        x: o.x, y: o.y - 120 * o.scale, t0: T, dur: 3.6, seed: rnd(100) });
      }
      continue;
    }
    if (d < 110 * Math.max(o.scale, 0.8)) tryTalk(o);
  }
  
  if (state !== 'chaos')
    for (const o of objects)
      if (o.type === 'fragment' && !o.dying && !o.dead) o.dying = T + 2.5;
  objects = objects.filter(o => !o.dead);
  bushes = bushes.filter(b => !b.dieT || T - b.dieT < 0.7);
  tickVines(dt);

  
  drawBackdrop();
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.rotate(cam.tilt);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);
  drawTiles();
  drawPaths();
  drawWards();
  drawVines();
  
  const scene = [];
  for (const b of bushes) scene.push({ y: b.y + b.gapY * gateOpen, kind: 'bush', v: b });
  for (const o of objects) scene.push({ y: o.y, kind: 'obj', v: o });
  scene.push({ y: player.y + 0.1, kind: 'player' });
  if (drowse.active) scene.push({ y: drowse.y, kind: 'drowse' });
  if (started) scene.push({ y: core.y + 6, kind: 'core' });
  scene.sort((a, b) => a.y - b.y);
  for (const it of scene){
    if (it.kind === 'bush') drawBush(it.v);
    else if (it.kind === 'obj') drawObject(it.v);
    else if (it.kind === 'drowse') drawDrowse();
    else if (it.kind === 'core') drawCore();
    else {
      drawTurnAfterimages();
      for (const g of ghosts)
        drawPlayerChar(g.x, g.y, g.face, player.walk, 0.25 * (1 - (T - g.t) / 0.3), true);
      drawPlayerChar(player.x, player.y, player.face, player.walk, 1, T < player.dashUntil);
    }
  }
  drawStateSignatures();
  drawPlayerLight();
  drawChoiceZones();
  drawParticles(dt);
  drawDialogues();
  ctx.restore();
  if (started && !waking){ drawCoreIndicator(); drawExitIndicator(); }
  drawMajorTransition();
  drawOverlays();
}
requestAnimationFrame(frame);
